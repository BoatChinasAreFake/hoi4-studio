l_french:
 GDR_sovereign_ambition:0 "A Small State, A Large Resolve"
 GDR_sovereign_ambition_desc:0 "The Grand Duchy has survived every storm Europe has thrown at it. Now it must decide what it wants to become."
 GDR_steel_charter:0 "The Steel Charter"
 GDR_steel_charter_desc:0 "Luxembourg's iron and steel are the backbone of its prosperity. A national charter will bind the great works to the national interest."
 GDR_modernize_the_works:0 "Modernize the Works"
 GDR_modernize_the_works_desc:0 "Electric furnaces and continuous rolling mills will let the valley outproduce rivals ten times its size."
 GDR_rail_nexus:0 "The Rail Nexus"
 GDR_rail_nexus_desc:0 "Every line between Paris, Brussels, Cologne and Strasbourg can be made to pass through the Duchy."
 GDR_research_college:0 "The Metallurgical College"
 GDR_research_college_desc:0 "A technical college in the capital will train the engineers the works so badly need."
 GDR_ore_to_arms:0 "From Ore to Arms"
 GDR_ore_to_arms_desc:0 "Convert part of the steel output into weapons for the national defence."
 GDR_cooperatives:0 "Industrial Cooperatives"
 GDR_cooperatives_desc:0 "Workers' cooperatives share tools, patents and shipping, trimming waste across the valley."
 GDR_forge_of_europe:0 "The Forge of Europe"
 GDR_forge_of_europe_desc:0 "Our steel will be in the girders of every bridge and the hulls of every ship on the continent."
 GDR_guard_the_gap:0 "Guard the Gap"
 GDR_guard_the_gap_desc:0 "The Ardennes are said to be impassable to armour. We should make certain they are."
 GDR_ardennes_line:0 "The Ardennes Line"
 GDR_ardennes_line_desc:0 "Concrete, wire and demolition charges at every bridge and road cut."
 GDR_citizen_reserve:0 "The Citizen Reserve"
 GDR_citizen_reserve_desc:0 "Every able citizen will know where to stand and what to carry on the day it matters."
 GDR_border_garrisons:0 "Border Garrisons"
 GDR_border_garrisons_desc:0 "Permanent garrisons in the frontier towns, supplied from the capital by rail."
 GDR_mobile_reserve:0 "A Mobile Reserve"
 GDR_mobile_reserve_desc:0 "Trucks and bicycles for a small force that can reach any point of the frontier in a day."
 GDR_field_manual:0 "The Field Manual"
 GDR_field_manual_desc:0 "Lessons from every border incident and exercise, written down for every officer."
 GDR_open_ledger:0 "The Open Ledger"
 GDR_open_ledger_desc:0 "A discreet, trustworthy and well-connected financial centre is the Duchy's other great export."
 GDR_financial_hub:0 "A Financial Hub"
 GDR_financial_hub_desc:0 "Banks, insurers and shipping agents will gather where law is stable and tax is light."
 GDR_diplomatic_quarter:0 "The Diplomatic Quarter"
 GDR_diplomatic_quarter_desc:0 "Host every conference worth hosting. A neutral capital makes an excellent meeting room."
 GDR_trade_treaties:0 "Trade Treaties"
 GDR_trade_treaties_desc:0 "Preferential agreements with all four neighbours, and with their rivals."
 GDR_national_festival:0 "The National Festival"
 GDR_national_festival_desc:0 "Folk music, fireworks and free beer on the Grand Duchess's birthday. Morale is a national resource too."
 GDR_international_bank:0 "The International Bank"
 GDR_international_bank_desc:0 "A bank of banks, trusted by those who trust nobody else."
 GDR_armed_neutrality:0 "Armed Neutrality"
 GDR_armed_neutrality_desc:0 "We will not be anyone's road. Let it be known that the price of crossing us is paid in full."
 GDR_benelux_pact:0 "The Benelux Pact"
 GDR_benelux_pact_desc:0 "Three small nations are stronger when they stand and trade together."
 GDR_western_alignment:0 "Western Alignment"
 GDR_western_alignment_desc:0 "Neutrality has failed before. The Duchy's future lies with the great democracies, if they will have it."
 GDR_total_defense:0 "Total Defence Doctrine"
 GDR_total_defense_desc:0 "Every road, bridge and cellar is part of the defence."
 GDR_hardened_borders:0 "Hardened Borders"
 GDR_hardened_borders_desc:0 "Layered strongpoints on every approach."
 GDR_neutral_arsenal:0 "The Neutral Arsenal"
 GDR_neutral_arsenal_desc:0 "Weapons made at home, for use at home, and sold to whoever pays."
 GDR_unbreakable_duchy:0 "The Unbreakable Duchy"
 GDR_unbreakable_duchy_desc:0 "No one has ever walked through Luxembourg without regretting it."
 GDR_customs_union:0 "The Customs Union"
 GDR_customs_union_desc:0 "No more tariff walls between the three capitals."
 GDR_joint_command:0 "The Joint Command"
 GDR_joint_command_desc:0 "Staff talks between Brussels, The Hague and Luxembourg."
 GDR_common_market:0 "The Common Market"
 GDR_common_market_desc:0 "One market, one rulebook, one set of weights and measures."
 GDR_lowlands_federation:0 "The Lowlands Federation"
 GDR_lowlands_federation_desc:0 "The seed of something new at the heart of Europe."
 GDR_guarantee_request:0 "Request a Guarantee"
 GDR_guarantee_request_desc:0 "We will ask London and Paris plainly what they will do if the frontier is crossed."
 GDR_allied_liaison:0 "Allied Liaison Staff"
 GDR_allied_liaison_desc:0 "Officers of all three armies, in one office, with one map."
 GDR_lend_lease_prep:0 "Prepare for Allied Supply"
 GDR_lend_lease_prep_desc:0 "Depots, rail sidings and warehouses ready to receive allied matériel."
 GDR_arsenal_of_the_west:0 "Arsenal of the West"
 GDR_arsenal_of_the_west_desc:0 "The great works will turn out whatever the democracies need."
 GDR_grand_duchy_rising:0 "The Grand Duchy Rises"
 GDR_grand_duchy_rising_desc:0 "A small country that decided to matter, and did."
 GDR_steel_charter_idea:0 "The Steel Charter"
 GDR_steel_charter_idea_desc:0 "The great works are bound to the national interest."
 GDR_forge_of_europe_idea:0 "The Forge of Europe"
 GDR_forge_of_europe_idea_desc:0 "Luxembourg steel is in everything."
 GDR_cooperatives_idea:0 "Industrial Cooperatives"
 GDR_cooperatives_idea_desc:0 "Shared tools, shared patents, less waste."
 GDR_ardennes_garrisons:0 "Ardennes Garrisons"
 GDR_ardennes_garrisons_desc:0 "Permanent garrisons guard every pass."
 GDR_citizen_reserve_idea:0 "The Citizen Reserve"
 GDR_citizen_reserve_idea_desc:0 "Every citizen knows where to stand."
 GDR_financial_hub_idea:0 "A Financial Hub"
 GDR_financial_hub_idea_desc:0 "Money flows through the capital."
 GDR_armed_neutrality_idea:0 "Armed Neutrality"
 GDR_armed_neutrality_idea_desc:0 "Nobody's road."
 GDR_total_defense_idea:0 "Total Defence"
 GDR_total_defense_idea_desc:0 "Every road, bridge and cellar is part of the defence."
 GDR_unbreakable_idea:0 "The Unbreakable Duchy"
 GDR_unbreakable_idea_desc:0 "Regretted by all who tried."
 GDR_benelux_idea:0 "The Benelux Pact"
 GDR_benelux_idea_desc:0 "Three small nations standing together."
 GDR_common_market_idea:0 "The Common Market"
 GDR_common_market_idea_desc:0 "One market, one rulebook."
 GDR_lowlands_idea:0 "The Lowlands Federation"
 GDR_lowlands_idea_desc:0 "The seed of something new."
 GDR_western_idea:0 "Western Alignment"
 GDR_western_idea_desc:0 "The future lies with the democracies."
 GDR_arsenal_west_idea:0 "Arsenal of the West"
 GDR_arsenal_west_idea_desc:0 "The works turn out what the democracies need."
 GDR_savings_idea:0 "National Savings Drive"
 GDR_savings_idea_desc:0 "Thrift is a civic virtue."
 GDR_drills_idea:0 "Reserve Drills"
 GDR_drills_idea_desc:0 "Weekend soldiers, weekday engineers."
 GDR_mobilized_idea:0 "Reserves Mobilised"
 GDR_mobilized_idea_desc:0 "The citizen reserve is under arms."
 GDR_expand_steelworks:0 "Expand the Steelworks"
 GDR_expand_steelworks_desc:0 "Add another furnace line in the capital valley."
 GDR_extend_railways:0 "Extend the Railways"
 GDR_extend_railways_desc:0 "More sidings, more junctions, more throughput."
 GDR_savings_drive:0 "National Savings Drive"
 GDR_savings_drive_desc:0 "Ask the nation to tighten its belt for a season."
 GDR_reserve_drills:0 "Reserve Drills"
 GDR_reserve_drills_desc:0 "Call the citizen reserve out for field exercises."
 GDR_research_grant:0 "Fund the College"
 GDR_research_grant_desc:0 "A national grant for the metallurgical college."
 GDR_diplomatic_gala:0 "Host a Diplomatic Gala"
 GDR_diplomatic_gala_desc:0 "Invite every ambassador to a very good dinner."
 GDR_mobilize_reserves:0 "Mobilise the Reserves"
 GDR_mobilize_reserves_desc:0 "The frontier is in danger. Call out the citizen reserve."
 GDR_grand_duchy_projects:0 "Grand Duchy Projects"
 GDR_grand_duchy_projects_desc:0 "National projects that carry the Grand Duchy toward its ambitions."
 gdr.1.t:0 "Winds Over the Valley"
 gdr.1.d:0 "Europe is restless, and the Grand Duchy is small. Ministers argue over what a small country can do. Whatever it is, it must start soon."
 gdr.1.a:0 "We will make our own future."
 gdr.2.t:0 "The Ministers Convene"
 gdr.2.d:0 "The cabinet has met to draw up the national programme. Industry, defence and finance all demand to go first."
 gdr.2.a:0 "Industry first."
 gdr.2.b:0 "Defence first."
 gdr.2.c:0 "Finance first."
 gdr.3.t:0 "The Steel Accord"
 gdr.3.d:0 "Union leaders and furnace owners have agreed a charter after a week of talks. Neither is happy; both will sign."
 gdr.3.a:0 "A fair settlement."
 gdr.3.b:0 "Weighted towards the owners."
 gdr.4.t:0 "Incident at the Frontier"
 gdr.4.d:0 "A foreign patrol strayed across the border last night. No shots were fired, but the whole garrison has taken note."
 gdr.4.a:0 "Protest, firmly."
 gdr.4.b:0 "Reinforce the frontier."
 gdr.5.t:0 "The Banks Open Their Doors"
 gdr.5.d:0 "Foreign bankers are queuing outside the ministry of finance. Discretion, they say, is worth a premium."
 gdr.5.a:0 "Welcome them."
 gdr.5.b:0 "Regulate first."
 gdr.6.t:0 "The Neutral Fortress"
 gdr.6.d:0 "The Chamber has voted for armed neutrality. Every neighbour has been informed, politely and in writing."
 gdr.6.a:0 "Let them read it twice."
 gdr.7.t:0 "Three Capitals, One Table"
 gdr.7.d:0 "Delegates from Brussels and The Hague have arrived by train. The agenda is long and the coffee is excellent."
 gdr.7.a:0 "To a lasting partnership."
 gdr.8.t:0 "A Letter to London and Paris"
 gdr.8.d:0 "Our envoys have delivered the request. The replies will say a great deal about whom we can trust."
 gdr.8.a:0 "We shall see."
 gdr.9.t:0 "The Grand Duchy Rises"
 gdr.9.d:0 "Whatever else history says, the Grand Duchy decided what it wanted to be, and then became it."
 gdr.9.a:0 "A small country with a large name."
 gdr.10.t:0 "Steelworkers Walk Out"
 gdr.10.d:0 "Pay disputes at the great works have escalated into a walkout. Furnaces are cooling by the hour."
 gdr.10.a:0 "Grant a pay rise."
 gdr.10.b:0 "Hold firm."
 gdr.11.t:0 "A Cultural Festival at the Castle"
 gdr.11.d:0 "The country's musicians and brewers have filled the capital. For one weekend nobody mentions the border."
 gdr.11.a:0 "Raise a glass."
 GDR_grant_bonus:0 "Ducal Grant Bonus"
 GDR_forge_bonus:0 "Ducal Forge Bonus"
 GDR_field_bonus:0 "Ducal Field Bonus"
 GDR_arsenal_bonus:0 "Ducal Arsenal Bonus"
 GDR_liaison_bonus:0 "Ducal Liaison Bonus"
 GDR_ducal_drill_manual:0 "Ducal Drill Manual"
 GDR_ducal_drill_manual_desc:0 "Ducal Drill Manual improves the Grand Duchy's infantry."
 GDR_fortified_valleys:0 "Fortified Valleys"
 GDR_fortified_valleys_desc:0 "Fortified Valleys improves the Grand Duchy's infantry."
 GDR_offer_steel_partnership:0 "Offer Steel Partnership"
 GDR_offer_steel_partnership_desc:0 "Offer a steel partnership to a friendly nation."
